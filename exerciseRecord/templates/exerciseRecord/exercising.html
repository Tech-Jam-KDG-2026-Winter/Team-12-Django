{% extends 'base.html' %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'exercising.css' %}">
{% endblock %}
{% block title %}運動計測{% endblock %}

{% block content %}
<div class="container">
    <div class="inner-container">
    {% if is_exercising %}
        <div>
            <p class="text-big-1">開始時刻: {{ start_time|date:"H:i" }}</p>
            <div id="elapsed-time" class="text-big">00:00:00</div>
        </div>

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="action" value="end">
            <button class="button-big green-button" type="submit">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="dumbbell" aria-hidden="true" class="lucide lucide-dumbbell"><path d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z"></path><path d="m2.5 21.5 1.4-1.4"></path><path d="m20.1 3.9 1.4-1.4"></path><path d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z"></path><path d="m9.6 14.4 4.8-4.8"></path></svg>
                終了
            </button>
        </form>

        <script>
            // 経過時間タイマー
            function updateTimer() {
                const startTime = new Date("{{ start_time|date:'Y-m-d H:i:s' }}");
                const now = new Date();
                const diff = Math.floor((now - startTime) / 1000);

                if (diff < 0) return;

                const hours = Math.floor(diff / 3600).toString().padStart(2, '0');
                const minutes = Math.floor((diff % 3600) / 60).toString().padStart(2, '0');
                const seconds = (diff % 60).toString().padStart(2, '0');

                document.getElementById('elapsed-time').textContent = `${hours}:${minutes}:${seconds}`;
            }

            setInterval(updateTimer, 1000);
            updateTimer();
        </script>
    {% else %}
            <h1>運動を始めましょう！</h1>
            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="action" value="start">
                <button class="button-big green-button" type="submit">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="dumbbell" aria-hidden="true" class="lucide lucide-dumbbell"><path d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z"></path><path d="m2.5 21.5 1.4-1.4"></path><path d="m20.1 3.9 1.4-1.4"></path><path d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z"></path><path d="m9.6 14.4 4.8-4.8"></path></svg>
                    開始
                </button>
            </form>
    {% endif %}
    </div>
</div>
{% endblock %}
