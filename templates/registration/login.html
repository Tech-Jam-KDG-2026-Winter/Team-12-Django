{% extends "base.html" %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'login.css' %}">
{% endblock %}

{% block content %}
<!-- メインコンテンツ -->
<div class="login-container">
    <!-- ログインカード -->
    <div class="login-card">
        <h2 class="login-title">ログイン</h2>

        <form method="post">
            {% csrf_token %}
            <!-- メールアドレス -->
            <div class="form-group">
                <label class="form-label" for="username">名前</label>
                <input type="text" name="username" id="username" class="form-input" required>
            </div>

            <!-- パスワード -->
            <div class="form-group">
                <label class="form-label" for="password">パスワード</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
                    <button type="button" class="password-toggle" id="passwordToggle">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="eye" aria-hidden="true" class="lucide lucide-eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <!-- オプション -->
            <div class="form-options">
                <a href="#" class="forgot-password">パスワードを忘れた場合</a>
            </div>

            <!-- ログインボタン -->
            <button type="submit" class="btn btn-primary">ログイン</button>
        </form>

        <!-- 区切り線 -->
        <div class="divider">
        </div>

        <!-- サインアップリンク -->
        <div class="signup-link">
            アカウントをお持ちでない方は <a href="{% url 'accounts:signup' %}">新規登録</a>
        </div>
    </div>
</div>
{% endblock %}
