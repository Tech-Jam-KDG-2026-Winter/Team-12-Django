{% extends "base.html" %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'login.css' %}">
{% endblock %}
{% block title %}アカウント作成{% endblock %}
{% block h1 %}アカウント作成{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <h2 class="login-title">新規登録</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="username">名前</label>
                <input type="text" name="username" id="username" class="form-input" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">パスワード</label>
                <div class="password-wrapper">
                    <input type="password" name="password1" class="form-input" placeholder="パスワード" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">パスワード確認用</label>
                <div class="password-wrapper">
                    <input type="password" name="password2" class="form-input" placeholder="パスワード確認用" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">登録</button>
        </form>

        <!-- 区切り線 -->
        <div class="divider">
        </div>

        <!-- サインアップリンク -->
        <div class="signup-link">
            アカウントをお持ちの方は <a href="{% url 'accounts:login' %}">ログイン</a>
        </div>
    </div>
</div>
{% endblock %}
