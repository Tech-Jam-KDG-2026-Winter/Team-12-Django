{% extends "base.html" %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'login.css' %}">
{% endblock %}
{% block title %}アカウント作成{% endblock %}
{% block h1 %}アカウント作成{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <h2 class="login-title">新規登録</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="icon-input">
                <input type="file" name="profile_image" id="profile-image-input">
                <img src="/media/profile_images/default_profile.png" id="profile-image-view" alt="">
            </div>
            <div class="form-group">
                <label class="form-label" for="username">名前</label>
                <input type="text" name="username" id="username" class="form-input" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">パスワード</label>
                <div class="password-wrapper">
                    <input type="password" name="password1" class="form-input" placeholder="パスワード" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">パスワード確認用</label>
                <div class="password-wrapper">
                    <input type="password" name="password2" class="form-input" placeholder="パスワード確認用" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">登録</button>
        </form>

        <!-- 区切り線 -->
        <div class="divider">
        </div>

        <!-- サインアップリンク -->
        <div class="signup-link">
            アカウントをお持ちの方は <a href="{% url 'accounts:login' %}">ログイン</a>
        </div>
    </div>
    <script>
        // 画像クリックでファイル選択を開く
        document.getElementById('profile-image-view').addEventListener('click', function () {
            document.getElementById('profile-image-input').click();
        });

        // ファイル選択時のプレビュー表示
        document.getElementById('profile-image-input').addEventListener('change', function (event) {
            const file = event.target.files[0];
            const imageView = document.getElementById('profile-image-view');

            if (file) {
                // 画像ファイルかチェック
                if (!file.type.startsWith('image/')) {
                    alert('画像ファイルを選択してください');
                    this.value = '';
                    return;
                }

                const reader = new FileReader();

                reader.onload = function (e) {
                    imageView.src = e.target.result;
                };

                reader.readAsDataURL(file);
            }
        });
    </script>
</div>
{% endblock %}
